            Crear un módulo: Building a module
            El manifest: The manifest
            Interfaz de usuario: User interface
            Eventos y hooks: Events and hooks
            Validación y tests: Validation and tests
            # API
            Autenticación: Authentication
            Vender e integrar desde fuera: Selling and integrating from outside
            Convenciones: Conventions
