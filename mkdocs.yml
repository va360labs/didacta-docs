# Sitio de documentación de Didacta — https://docs.didacta.io
# Generado con MkDocs Material.

site_name: Didacta Docs
site_url: https://docs.didacta.io/
site_description: >-
  Documentación oficial de Didacta — LMS fair-code, modular y listo para
  Fundae. Instalación, configuración, módulos, API y Enterprise.
site_author: VA360 LABS S.L.
copyright: Copyright &copy; 2026 VA360 LABS S.L. — Didacta™ es una marca de VA360 LABS S.L.

repo_url: https://github.com/va360labs/didacta-io
repo_name: va360labs/didacta-io
edit_uri: ""

theme:
  name: material
  language: es
  logo: assets/anagrama.png
  favicon: assets/anagrama.png
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

validation:
  links:
    anchors: warn

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  # Version publicada mas reciente de didacta-io. Es solo el valor por
  # defecto: el workflow de deploy la sobreescribe en cada build con la
  # ultima release real de GitHub, y un cron diario reconstruye el sitio
  # para que nunca se quede vieja. En las paginas: {{ didacta_version }}.
  didacta_version: 0.1.0-beta.1
  # Canal derivado de esa version (-alpha -> Alpha, -beta -> Beta, sin
  # sufijo -> Estable/Stable). Tambien lo refresca el deploy en cada build:
  # ninguna pagina vuelve a escribir el canal a mano.
  didacta_channel: Beta
  didacta_channel_en: Beta
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/va360labs/didacta-io
    - icon: fontawesome/brands/docker
      link: https://github.com/va360labs/didacta-io/pkgs/container/didacta-community
    - icon: material/web
      link: https://didacta.io

plugins:
  # El buscador se declara explícitamente porque al añadir `plugins:` deja de
  # cargarse el plugin `search` por defecto de MkDocs.
  - search:
      lang:
        - es
        - en
  # Variables en las paginas ({{ didacta_version }}). Va antes de i18n
  # para que las dos lenguas rendericen las mismas variables.
  - macros:
      # Solo las paginas que lo piden (render_macros: true en su
      # front-matter): las anclas {#...} del resto parecen comentarios Jinja
      # y rompian el build en estricto.
      render_by_default: false
  # Sitio bilingüe. Estructura `suffix`: el español (idioma por defecto) se
  # queda en `docs/<ruta>.md` y conserva EXACTAMENTE sus URLs actuales; el
  # inglés vive en `docs/<ruta>.en.md` y se publica bajo `/en/<ruta>/`.
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: es
          name: Español
          default: true
          build: true
        - locale: en
          name: English
          build: true
          site_description: >-
            Official Didacta documentation — the fair-code, modular LMS with
            built-in Fundae support. Installation, configuration, modules, API
            and Enterprise.
          copyright: >-
            Copyright &copy; 2026 VA360 LABS S.L. — Didacta&trade; is a trademark
            of VA360 LABS S.L.
          theme:
            palette:
              - toggle:
                  name: Switch to dark mode
              - toggle:
                  name: Switch to light mode
          nav_translations:
            # Secciones y páginas de primer nivel
            Inicio: Home
            Primeros pasos: Getting started
            Ediciones: Editions
            Arquitectura: Architecture
            # Instalación
            Instalación: Installation
            docker run manual: Manual docker run
            Asistente de configuración: Setup wizard
            "Recorrido visual: primeros pasos": "Visual walkthrough: getting started"
            "Recorrido visual: notificaciones y ventas": "Visual walkthrough: notifications and sales"
            Actualizar: Upgrading
            Copias de seguridad: Backups
            Solución de problemas: Troubleshooting
            # Configuración
            Configuración: Configuration
            Variables de entorno: Environment variables
            Base de datos: Database
            Almacenamiento: Storage
            IA (BYOK): AI (BYOK)
            Aula virtual (Zoom): Virtual classroom (Zoom)
            Branding whitelabel: Whitelabel branding
            Telemetría: Telemetry
            # Módulos
            Módulos: Modules
            Catálogo de módulos: Module catalog
            Cursos y catálogo: Courses and catalog
            Player y progreso: Player and progress
            Quizzes y exámenes: Quizzes and exams
            Certificados: Certificates
            Grupos de acceso: Access groups
            Inscripción de miembros: Member registration
            SSO desde WordPress: WordPress SSO
