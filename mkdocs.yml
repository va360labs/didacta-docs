            Tests en local: Running tests locally
            Licencias: Licenses

  # Las páginas se llamaban en español (`/instalacion/`, `/modulos/catalogo/`…)
  # y desde nov-2026 van en inglés, igual que las URL del aula. Cada ruta
  # vieja sigue funcionando: GitHub Pages no sabe dar un 301, así que se
  # publica en ella una página que manda a la nueva (meta refresh + enlace
  # canónico). Va en las dos lenguas (`/<ruta>/` y `/en/<ruta>/`). Esta
